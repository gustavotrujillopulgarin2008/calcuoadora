<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - Calculadora de Materiales</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- estructura principal de la pagina -->
  <div class="contenedor">


  <!-- barra de arriba con el titulo -->
    <div class="topbar">
      <div class="icon">🧱</div>
      <span>Calculadora de<br>Materiales de Construcción</span>
    </div>


  <!-- tarjeta blanca del contenido -->
    <div class="screen">

      <!-- formulario de registro -->
      <h2>Registro de Usuario</h2>

      <label>Nombre de usuario</label>
      <input id="f-user" placeholder="Nombre de usuario">

      <label>Contraseña</label>
      <input id="f-pass" type="password" placeholder="Contraseña">

      <label>Confirmar contraseña</label>
      <input id="f-pass2" type="password" placeholder="Confirmar contraseña">


      <div class="error" id="form-err"></div>


      <!-- boton para crear la cuenta -->
      <button class="btn-primary" onclick="hacerRegistro()">Registrarse</button>


      <!-- link para volver al login -->
      <button class="btn-link" onclick="window.location.href='index.html'">¿Ya tienes cuenta? Inicia sesión</button>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
